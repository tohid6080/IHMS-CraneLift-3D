name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "شماره نسخه (versionName) — مثل 1.0.0"
        required: true
        default: "1.0.0"
      version_code:
        description: "versionCode عددی (باید از نسخه‌ی قبلی بزرگ‌تر باشد) — خالی بگذارید تا خودکار از رویِ شماره‌ی اجرای این workflow محاسبه شود (همیشه از اجرای قبلی بزرگ‌تر است، پس هرگز با بازار تداخل نمی‌کند)"
        required: false
        default: ""
      release_notes:
        description: "Release Notes — تغییرات این نسخه (اختیاری)"
        required: false
        default: ""
      publish_release:
        description: "یک GitHub Release عمومی هم ساخته شود؟"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web app (static export)
        run: npm run build

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Add Android platform
        run: npx cap add android

      # سیم‌کشیِ خریدِ درون‌برنامه‌ایِ کافه‌بازار (Poolakey) — فعال‌سازیِ
      # Kotlin در پروژه‌ی اندروید، افزودنِ وابستگیِ Poolakey، کپیِ پلاگینِ
      # android-native/bazaar-billing/BazaarBillingPlugin.kt به داخلِ
      # android/app و ثبتِ آن در MainActivity. این مرحله در هر دو APKِ
      # debug و release اعمال می‌شود.
      - name: Wire Bazaar billing plugin (Poolakey)
        run: |
          set -e
          # ۱) افزودنِ classpathِ کاتلین + مخزنِ JitPack (Poolakey از طریقِ
          # JitPack توزیع می‌شود، نه Maven Central/Google — با sedِ ساده
          # قابلِ‌انجام نبود چون هر دو بلاکِ repositories در این فایل عیناً
          # یک‌شکل‌اند؛ با پایتون دقیقاً فقط بلاکِ allprojects هدف گرفته می‌شود)
          python3 << 'PY_EOF'
          p = "android/build.gradle"
          s = open(p).read()
          s = s.replace(
              "classpath 'com.google.gms:google-services:4.4.0'",
              "classpath 'com.google.gms:google-services:4.4.0'\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'",
              1,
          )
          s = s.replace(
              "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}",
              "allprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url 'https://jitpack.io' }\n    }\n}",
              1,
          )
          open(p, "w").write(s)
          PY_EOF

          # ۲) اعمالِ پلاگینِ kotlin-android و افزودنِ وابستگیِ Poolakey
          # (مختصاتِ JitPack: com.github.cafebazaar.Poolakey:poolakey — تأییدشده
          # از README رسمیِ github.com/cafebazaar/Poolakey، نسخه‌ی ۲.۳.۰)
          sed -i "s/apply plugin: 'com.android.application'/apply plugin: 'com.android.application'\napply plugin: 'kotlin-android'/" android/app/build.gradle
          sed -i "/implementation project(':capacitor-cordova-android-plugins')/a\\    implementation \"org.jetbrains.kotlin:kotlin-stdlib:1.9.24\"\\n    implementation \"com.github.cafebazaar.Poolakey:poolakey:2.3.0\"" android/app/build.gradle

          # ۳) کپیِ سورسِ Kotlinِ پلاگین
          mkdir -p android/app/src/main/java/com/ihms/cranelift3d
          cp android-native/bazaar-billing/BazaarBillingPlugin.kt android/app/src/main/java/com/ihms/cranelift3d/BazaarBillingPlugin.kt

          # ۴) ثبتِ پلاگین در MainActivity
          cat > android/app/src/main/java/com/ihms/cranelift3d/MainActivity.java << 'JAVA_EOF'
          package com.ihms.cranelift3d;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(BazaarBillingPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA_EOF

          echo "----- android/build.gradle (buildscript deps) -----"
          grep -A5 "dependencies {" android/build.gradle | head -8
          echo "----- android/app/build.gradle (head + poolakey dep) -----"
          head -3 android/app/build.gradle
          grep -n "poolakey\|kotlin-stdlib" android/app/build.gradle

      # کلیدِ امضای debug ثابت (کامیت‌شده در ریپو، رمز استاندارد "android") —
      # بدون این، هر اجرای CI یک debug.keystore تصادفی می‌سازد و امضای
      # APKها فرق می‌کند، یعنی اندروید اجازه‌ی نصبِ آپدیت روی نسخه‌ی قبلی را
      # نمی‌دهد. این فقط برای توزیعِ تستی/دستی (sideload) است — برای انتشارِ
      # نهایی روی کافه‌بازار باید یک keystoreِ release جدا و محرمانه (که در
      # این فایل نیست) ساخته و به‌عنوانِ GitHub Secret اضافه شود.
      - name: Use stable debug signing key
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          cp android-signing/debug.keystore android/app/debug.keystore
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          // --- تزریق‌شده توسط build-android.yml: امضایِ debug ثابت و صریح ---
          android {
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE_EOF
          echo "Stable debug keystore in place."

      - name: Set app version in Gradle
        run: |
          VERSION_CODE="${{ github.event.inputs.version_code }}"
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="${{ github.run_number }}"
            echo "version_code ورودی خالی بود — از شماره‌ی اجرای CI استفاده شد: $VERSION_CODE"
          fi
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" "$GRADLE"
          sed -i "s/versionName .*/versionName \"${{ github.event.inputs.version }}\"/" "$GRADLE"
          echo "----- versions in build.gradle -----"
          grep -E "versionCode|versionName" "$GRADLE"

      - name: Generate Splash Screen assets
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # امضایِ release واقعی برایِ انتشار در کافه‌بازار — فقط اگر سکرت‌های
      # زیر در ریپو تنظیم شده باشند (Settings → Secrets and variables →
      # Actions): ANDROID_RELEASE_KEYSTORE_BASE64، ANDROID_RELEASE_KEY_ALIAS،
      # ANDROID_RELEASE_KEY_PASSWORD. اگر تنظیم نشده باشند این مرحله و
      # مرحله‌ی بعدی بی‌صدا رد می‌شوند و فقط همان APKِ debug تولید می‌شود —
      # هرگز با کلیدِ debug (که داخلِ این ریپوی عمومی است) برایِ انتشارِ
      # نهایی استفاده نکنید.
      - name: Build release APK (signed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ANDROID_RELEASE_* secrets not set — skipping signed release build. Only the debug APK was produced."
            echo "HAS_RELEASE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          # مقادیرِ Secret هرگز مستقیماً داخلِ سورسِ Groovy اینترپولیت
          # نمی‌شوند (اگر مقدار شاملِ یک تک‌کوتیشن یا newline باشد، چه با
          # اینترپولیشنِ bash و چه با ابزاری مثلِ xargs، سینتکسِ
          # build.gradle یا خودِ پردازشِ bash می‌شکند — هر دو این مشکلات در
          # تلاش‌های قبلی رخ داد). به‌جایش، هر مقدار بدونِ هیچ پردازشی در
          # یک فایلِ متنیِ ساده نوشته می‌شود و خودِ Gradle (نه bash) آن را
          # در زمانِ build می‌خواند — این‌طور هیچ کاراکتری در مقدارِ Secret
          # اهمیتی ندارد.
          printf '%s' "$KEYSTORE_B64" | tr -d '\n\r ' | base64 -d > android/app/release.keystore
          printf '%s' "$KEY_ALIAS" > android/app/release_alias.txt
          printf '%s' "$KEY_PASSWORD" > android/app/release_password.txt
          cat >> android/app/build.gradle << 'GRADLE_EOF'

          // --- تزریق‌شده توسط build-android.yml: امضایِ release ---
          android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword new File("${project.projectDir}/release_password.txt").text.trim()
                      keyAlias new File("${project.projectDir}/release_alias.txt").text.trim()
                      keyPassword new File("${project.projectDir}/release_password.txt").text.trim()
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE_EOF
          cd android && ./gradlew assembleRelease
          echo "HAS_RELEASE=true" >> "$GITHUB_ENV"

      - name: Rename APK(s)
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/ihms-cranelift3d-${{ github.event.inputs.version }}-debug.apk"
          if [ "$HAS_RELEASE" = "true" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/ihms-cranelift3d-${{ github.event.inputs.version }}.apk"
          fi
          ls -lh out

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ihms-cranelift3d-apk-${{ github.event.inputs.version }}-debug
          path: out/ihms-cranelift3d-${{ github.event.inputs.version }}-debug.apk

      - name: Upload release APK artifact
        if: env.HAS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ihms-cranelift3d-apk-${{ github.event.inputs.version }}-release
          path: out/ihms-cranelift3d-${{ github.event.inputs.version }}.apk

      - name: Publish GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then NOTES="IHMS CraneLift 3D ${{ github.event.inputs.version }} (build $VERSION_CODE)"; fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          if [ "$HAS_RELEASE" = "true" ]; then
            gh release create "$TAG" \
              "out/ihms-cranelift3d-${{ github.event.inputs.version }}.apk" \
              "out/ihms-cranelift3d-${{ github.event.inputs.version }}-debug.apk" \
              --title "IHMS CraneLift 3D ${{ github.event.inputs.version }}" \
              --notes "$NOTES"
          else
            gh release create "$TAG" \
              "out/ihms-cranelift3d-${{ github.event.inputs.version }}-debug.apk" \
              --title "IHMS CraneLift 3D ${{ github.event.inputs.version }} (debug-signed only)" \
              --notes "$NOTES"
          fi
